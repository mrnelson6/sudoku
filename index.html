<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sudoku</title>
  <meta name="description" content="Unlimited sudoku with four difficulties and a daily puzzle leaderboard.">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app">
    <!-- Home -->
    <section id="home" class="view">
      <header class="home-header">
        <h1>Sudoku</h1>
        <button class="icon-btn" id="settings-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </header>

      <div class="card install-card" id="install-card" hidden>
        <div>
          <strong>Get the app</strong>
          <p id="install-text">Install Sudoku on your home screen for full-screen, offline play.</p>
        </div>
        <div class="install-actions">
          <button class="btn primary small" id="install-btn" hidden>Install</button>
          <button class="btn ghost small" id="install-dismiss">Not now</button>
        </div>
      </div>

      <article class="card daily-card">
        <div class="daily-top">
          <span class="eyebrow">Daily puzzle</span>
          <span class="streak" id="streak" hidden></span>
        </div>
        <h2 id="daily-date"></h2>
        <p class="muted" id="daily-meta"></p>
        <div class="btn-row">
          <button class="btn primary" id="daily-play">Play</button>
          <button class="btn" id="daily-board-btn">Leaderboard</button>
        </div>
      </article>

      <article class="card continue-card" id="continue-card" hidden>
        <div>
          <span class="eyebrow">In progress</span>
          <div class="continue-meta" id="continue-meta"></div>
        </div>
        <button class="btn primary" id="continue-btn">Resume</button>
      </article>

      <h3 class="section-title">New game</h3>
      <div class="difficulty-grid" id="difficulty-grid">
        <button class="difficulty" data-difficulty="easy"><span>Easy</span><small></small></button>
        <button class="difficulty" data-difficulty="medium"><span>Medium</span><small></small></button>
        <button class="difficulty" data-difficulty="hard"><span>Hard</span><small></small></button>
        <button class="difficulty" data-difficulty="expert"><span>Expert</span><small></small></button>
      </div>
    </section>

    <!-- Game -->
    <section id="game" class="view" hidden>
      <header class="game-header">
        <button class="icon-btn" id="back-btn" aria-label="Back to menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="game-title">
          <span id="game-label"></span>
          <small id="game-sub"></small>
        </div>
        <button class="timer-btn" id="pause-btn" aria-label="Pause">
          <span id="timer">0:00</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
        </button>
      </header>

      <div class="play-area">
        <div class="board-wrap">
          <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
          <div class="pause-overlay" id="pause-overlay" hidden>
            <button class="btn primary" id="resume-btn">Resume</button>
          </div>
          <div class="loading-overlay" id="loading-overlay" hidden>
            <div class="spinner"></div>
            <span>Generating puzzle…</span>
          </div>
        </div>

        <div class="controls">
          <div class="tools">
            <button class="tool" id="undo-btn">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
              <span>Undo</span>
            </button>
            <button class="tool" id="erase-btn">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7M5 11l9 9"/></svg>
              <span>Erase</span>
            </button>
            <button class="tool" id="notes-btn" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              <span>Notes</span>
              <em class="badge" id="notes-badge">Off</em>
            </button>
            <button class="tool" id="hint-btn">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>
              <span>Hint</span>
            </button>
          </div>
          <div class="numpad" id="numpad"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Win -->
  <dialog id="win-dialog">
    <div class="sheet">
      <h2>Solved!</h2>
      <div class="win-stats">
        <div><span class="stat-value" id="win-time"></span><span class="stat-label">Time</span></div>
        <div><span class="stat-value" id="win-mistakes"></span><span class="stat-label">Mistakes</span></div>
        <div><span class="stat-value" id="win-hints"></span><span class="stat-label">Hints</span></div>
      </div>
      <p class="muted center" id="win-note"></p>
      <form class="submit-form" id="submit-form" hidden>
        <label for="name-input">Add your time to today's leaderboard</label>
        <div class="input-row">
          <input id="name-input" maxlength="20" placeholder="Your name" autocomplete="nickname" enterkeyhint="send" required>
          <button class="btn primary" type="submit" id="submit-btn">Submit</button>
        </div>
      </form>
      <div class="btn-stack">
        <button class="btn primary" id="win-primary"></button>
        <button class="btn" id="win-share" hidden>Share result</button>
        <button class="btn ghost" id="win-home">Back to menu</button>
      </div>
    </div>
  </dialog>

  <!-- Leaderboard -->
  <dialog id="leaderboard-dialog">
    <div class="sheet">
      <div class="sheet-header">
        <h2>Leaderboard</h2>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="date-nav">
        <button class="icon-btn" id="lb-prev" aria-label="Previous day">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="lb-date"></span>
        <button class="icon-btn" id="lb-next" aria-label="Next day">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <p class="muted center small" id="lb-mine"></p>
      <p class="muted center small" id="lb-status"></p>
      <ol class="leaderboard" id="lb-list"></ol>
    </div>
  </dialog>

  <!-- Settings -->
  <dialog id="settings-dialog">
    <div class="sheet">
      <div class="sheet-header">
        <h2>Settings</h2>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <label class="toggle"><span>Show mistakes</span><input type="checkbox" data-setting="checkMistakes"><i></i></label>
      <label class="toggle"><span>Highlight matching numbers</span><input type="checkbox" data-setting="highlightSame"><i></i></label>
      <label class="toggle"><span>Vibration</span><input type="checkbox" data-setting="haptics"><i></i></label>
      <div class="setting-row">
        <span>Theme</span>
        <div class="segmented" id="theme-select">
          <button data-theme-value="auto">Auto</button>
          <button data-theme-value="light">Light</button>
          <button data-theme-value="dark">Dark</button>
        </div>
      </div>
      <p class="muted small" id="stats-summary"></p>
    </div>
  </dialog>

  <!-- Confirm -->
  <dialog id="confirm-dialog">
    <div class="sheet">
      <p id="confirm-text"></p>
      <div class="btn-row">
        <button class="btn" value="cancel" id="confirm-cancel">Cancel</button>
        <button class="btn primary" value="ok" id="confirm-ok">Continue</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
